<style>
/* =========================================================
   src/styles/tokens.css  — design tokens
   White is the base. Orange is the accent. Cream and warm
   yellow are supporting tints only.
   ========================================================= */
:root {
  --orange: #F97316;
  --orange-hover: #FB8A3C;
  --orange-ink: #B34A05;
  --orange-soft: #FFEFE0;
  --charcoal: #1C1917;
  --cream: #FFF8EE;
  --yellow: #F5B82E;
  --yellow-soft: #FFF4D6;
  --green: #3E9B5B;
  --green-ink: #2B7A43;
  --green-soft: #E3F3E8;
  --red: #C93838;
  --red-soft: #FCE6E6;

  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #FFF7EC;
  --text: #1C1917;
  --muted: #6B625B;
  --border: #EEE6DC;
  --focus: #1C1917;

  --btn-dark-bg: #1C1917;
  --btn-dark-text: #FFF8EE;
  --dark-bg: #1C1917;
  --on-dark: #FFF8EE;
  --on-dark-muted: #CFC4B8;

  --shadow-sm: 0 1px 2px rgba(28,25,23,.05), 0 2px 8px rgba(28,25,23,.04);
  --shadow-md: 0 12px 30px rgba(28,25,23,.09);
  --shadow-lg: 0 24px 60px rgba(28,25,23,.20);

  --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-xl: 30px;
  --header-h: 64px; --bottom-h: 68px;
  --font: 'Inter', 'Noto Sans Ethiopic', system-ui, -apple-system, 'Segoe UI', Roboto, 'Nyala', 'Abyssinica SIL', sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --bounce: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: light;
}

/* =========================================================
   src/styles/base.css
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--header-h) + 12px); -webkit-text-size-adjust: 100%; }
html.is-locked { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--bottom-h) + 12px);
}
img, svg { max-width: 100%; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(1.9rem, 5.4vw, 3.1rem); line-height: 1.08; font-weight: 700; letter-spacing: -.025em; }
h2 { font-size: clamp(1.4rem, 3.4vw, 2rem); line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
h3 { font-size: 1.05rem; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
.on-dark { --focus: #FFF8EE; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--charcoal); color: var(--cream); padding: 12px 16px; border-radius: 12px; transition: top .2s; }
.skip-link:focus { top: calc(env(safe-area-inset-top, 0px) + 8px); }
.container { width: 100%; max-width: 1180px; margin-inline: auto; padding-inline: 20px; }
@media (min-width: 900px) { .container { padding-inline: 32px; } body { padding-bottom: 0; } }
.section { padding-block: 36px; }
@media (min-width: 900px) { .section { padding-block: 56px; } }
.muted { color: var(--muted); }
.ink { color: var(--orange-ink); }
.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; }
.spread { justify-content: space-between; }
.stack > * + * { margin-top: var(--gap, 16px); }
[hidden] { display: none !important; }

/* =========================================================
   src/styles/motion.css
   ========================================================= */
.js-reveal .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s var(--ease) var(--d, 0ms), transform .7s var(--ease) var(--d, 0ms); }
.js-reveal .reveal[data-reveal="left"]  { transform: translateX(-30px); }
.js-reveal .reveal[data-reveal="right"] { transform: translateX(30px); }
.js-reveal .reveal[data-reveal="scale"] { transform: scale(.94); }
.js-reveal .reveal[data-reveal="fade"]  { transform: none; }
.js-reveal .reveal.is-visible { opacity: 1; transform: none; }
.page-enter { animation: pageIn .5s var(--ease) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.pop { animation: pop .55s var(--bounce); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 70% { transform: scale(.93); } 100% { transform: scale(1); } }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes photoIn { from { opacity: 0; transform: scale(.82) translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(249,115,22,.5); } 100% { box-shadow: 0 0 0 12px rgba(249,115,22,0); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .js-reveal .reveal { opacity: 1; transform: none; }
}

/* =========================================================
   src/components/Button.css
   ========================================================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 48px; padding: 0 1.3rem;
  border-radius: 999px; border: 1.5px solid transparent; font-weight: 600; font-size: .95rem; line-height: 1; text-decoration: none;
  white-space: nowrap; -webkit-tap-highlight-color: transparent;
  transition: transform .25s var(--bounce), background .2s, box-shadow .2s, border-color .2s, color .2s;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--orange); color: #1C1917; box-shadow: 0 6px 16px rgba(249,115,22,.32); }
.btn-primary:hover { background: var(--orange-hover); box-shadow: 0 8px 22px rgba(249,115,22,.42); }
.btn-dark { background: var(--btn-dark-bg); color: var(--btn-dark-text); }
.btn-dark:hover { opacity: .88; }
.btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--text); }
.btn-ghost { background: transparent; color: var(--text); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-glass { background: rgba(255,255,255,.55); color: #1C1917; border-color: rgba(28,25,23,.18); }
.btn-glass:hover { background: rgba(255,255,255,.8); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { filter: brightness(1.08); }
.on-dark .btn-outline { color: var(--on-dark); border-color: rgba(255,248,238,.38); }
.on-dark .btn-outline:hover { border-color: var(--on-dark); }
.btn-sm { min-height: 40px; padding: 0 1rem; font-size: .875rem; }
.btn-lg { min-height: 56px; padding: 0 1.8rem; font-size: 1rem; }
.btn-block { width: 100%; }
.btn-icon { width: 44px; min-height: 44px; padding: 0; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; box-shadow: none; pointer-events: none; }
.btn.is-loading { pointer-events: none; }
.btn.is-loading .btn-label { opacity: .6; }
.btn.is-loading::after { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--text); transition: background .2s, transform .25s var(--bounce); }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(.92); }
.ico { flex: none; }

/* =========================================================
   src/components/Header.css  (+ hamburger, bottom nav)
   ========================================================= */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid transparent; transition: border-color .25s, box-shadow .25s;
}
.site-header.is-scrolled { border-color: var(--border); box-shadow: var(--shadow-sm); }
.header-inner { height: var(--header-h); display: flex; align-items: center; gap: 16px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; }
.brand-mark { width: 40px; height: 40px; flex: none; border-radius: 50%; object-fit: contain; display: block; }
.brand-text { display: flex; flex-direction: column; line-height: 1.05; }
.brand-text b { font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em; }
.brand-text small { font-size: .74rem; color: var(--muted); font-weight: 500; margin-top: 3px; }
.header-nav { display: none; gap: 4px; }
.hn-link { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: .92rem; color: var(--muted); transition: background .2s, color .2s; }
.hn-link:hover { color: var(--text); background: var(--surface-2); }
.hn-link.is-active { color: var(--orange-ink); background: var(--orange-soft); }
@media (min-width: 900px) { .header-nav { display: flex; } }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--orange); color: #1C1917; font-size: .7rem; font-weight: 700; line-height: 20px; text-align: center; }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: grid; grid-template-columns: repeat(3, 1fr); align-items: end;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -6px 24px rgba(28,25,23,.07);
}
@media (min-width: 900px) { .bottom-nav { display: none; } }
.bn-item { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; padding: 6px 0 2px; color: var(--muted); font-size: .72rem; font-weight: 600; line-height: 1.1; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.bn-item.is-active { color: var(--text); }
.bn-ic { position: relative; width: 54px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .3s var(--ease), transform .3s var(--bounce); }
.bn-item:active .bn-ic { transform: scale(.9); }
.bn-item.is-active .bn-ic { background: var(--orange-soft); color: var(--orange-ink); }
.bn-fab .bn-ic { width: 58px; height: 58px; margin-top: -32px; border-radius: 50%; background: var(--orange); color: #1C1917; border: 4px solid var(--surface); box-shadow: 0 10px 22px rgba(249,115,22,.42); }
.bn-fab.is-active .bn-ic { background: var(--orange); color: #1C1917; animation: pulseRing 1.8s ease-out 1; }
.bn-fab .badge, .hn-link .badge { position: absolute; top: -4px; right: -4px; background: var(--charcoal); color: var(--cream); border: 2px solid var(--surface); }
.hn-link .badge { position: static; border: 0; background: var(--orange); color: #1C1917; }

/* Drawer (hamburger menu) */
.backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(20,17,16,.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); opacity: 0; transition: opacity .3s var(--ease); }
.backdrop.is-open { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 61; width: min(88vw, 380px); background: var(--surface); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); transform: translateX(104%); transition: transform .45s var(--ease); box-shadow: var(--shadow-lg); }
.drawer.is-open { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 12px 20px; min-height: var(--header-h); }
.drawer-nav { flex: 1; overflow-y: auto; padding: 8px 12px; display: grid; align-content: start; gap: 2px; }
.drawer-link { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 54px; padding: 0 14px; border: 0; border-radius: 16px; background: transparent; text-decoration: none; text-align: left; font-weight: 600; font-size: 1rem; color: var(--text); transition: background .2s, transform .3s var(--ease); }
.drawer-link:hover { background: var(--surface-2); }
.drawer-link.is-active { background: var(--orange-soft); color: var(--orange-ink); }
.drawer-link .di { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); flex: none; }
.drawer-link.is-active .di { background: var(--orange); color: #1C1917; }
.drawer-link .val { margin-left: auto; font-size: .85rem; font-weight: 500; color: var(--muted); }
.drawer-sep { height: 1px; background: var(--border); margin: 8px 14px; }
.drawer-foot { padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); }
.drawer .di-anim { opacity: 0; transform: translateX(16px); }
.drawer.is-open .di-anim { opacity: 1; transform: none; transition: opacity .5s var(--ease) var(--d, 0ms), transform .5s var(--ease) var(--d, 0ms); }

/* =========================================================
   src/components/Modal.css
   ========================================================= */
.modal-wrap { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
.modal { pointer-events: auto; width: 100%; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; background: var(--surface); color: var(--text); border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-lg); padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateY(40px); opacity: 0; transition: transform .45s var(--ease), opacity .3s; }
.modal.is-open { transform: none; opacity: 1; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 20px 12px 24px; }
.modal-head h2 { font-size: 1.3rem; }
.modal-body { overflow-y: auto; padding: 4px 24px 24px; }
.modal-foot { display: flex; gap: 10px; padding: 0 24px 24px; }
.modal-foot .btn { flex: 1; }
@media (min-width: 640px) {
  .modal-wrap { align-items: center; padding: 24px; }
  .modal { max-width: 520px; border-radius: var(--r-xl); transform: scale(.95) translateY(10px); }
  .modal.is-open { transform: none; }
  .modal.modal-lg { max-width: 760px; }
}

/* Toast / notifications */
.toast-root { position: fixed; z-index: 90; left: 0; right: 0; bottom: calc(var(--bottom-h) + 18px + env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; gap: 8px; padding: 0 16px; pointer-events: none; }
@media (min-width: 900px) { .toast-root { bottom: 24px; justify-items: end; padding: 0 28px; } }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 12px; max-width: 420px; width: 100%; padding: 12px 14px; border-radius: 18px; background: var(--btn-dark-bg); color: var(--btn-dark-text); box-shadow: var(--shadow-lg); animation: toastIn .5s var(--bounce) both; }
.toast.is-leaving { animation: toastOut .3s ease-in both; }
.toast .t-ic { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; background: var(--orange); }
.toast.success .t-ic { background: var(--green); } .toast.error .t-ic { background: var(--red); }
.toast .t-body { flex: 1; padding-top: 3px; font-size: .92rem; line-height: 1.4; }
.toast .t-body b { display: block; font-weight: 600; }
.toast .t-body span { opacity: .8; }
.toast .t-x { background: none; border: 0; color: inherit; opacity: .6; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; }
.toast .t-x:hover { opacity: 1; }
@keyframes toastIn { from { opacity: 0; transform: translateY(24px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(12px) scale(.96); } }

/* Notice / inline states */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-md); background: var(--orange-soft); font-size: .92rem; }
.notice .n-ic { flex: none; margin-top: 1px; }
.notice.success { background: var(--green-soft); } .notice.error { background: var(--red-soft); } .notice.warning { background: var(--yellow-soft); }
.notice b { display: block; font-weight: 600; }

/* =========================================================
   src/components/Card.css  (shared surfaces)
   ========================================================= */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
.card-pad { padding: 20px; }
@media (min-width: 900px) { .card-pad { padding: 26px; } }
.card-hover { transition: translate .35s var(--ease), box-shadow .35s var(--ease), border-color .25s; }
.card-hover:hover { translate: 0 -4px; box-shadow: var(--shadow-md); border-color: color-mix(in srgb, var(--orange) 45%, var(--border)); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: .76rem; font-weight: 600; background: var(--surface-2); color: var(--text); }
.chip.orange { background: var(--orange-soft); color: var(--orange-ink); }
.chip.green { background: var(--green-soft); color: var(--green-ink); }
.chip.yellow { background: var(--yellow-soft); color: var(--text); }
.chip.dark { background: var(--charcoal); color: var(--cream); }
.avatar { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; background: var(--orange-soft); color: var(--orange-ink); }
.price { font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.section-head p { color: var(--muted); margin-top: 6px; max-width: 52ch; }
.page-head { padding: 28px 0 8px; }
.page-head p { color: var(--muted); margin-top: 10px; max-width: 56ch; }

/* =========================================================
   src/components/ProductCard.css + CategoryTabs.css
   ========================================================= */
.product-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; } }
@media (min-width: 1000px) { .product-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.product-card { display: flex; flex-direction: column; overflow: hidden; }
/* Photo: icon placeholder underneath, image fades in on top once loaded */
.photo { position: relative; display: block; overflow: hidden; background: linear-gradient(140deg, var(--cream), var(--yellow-soft)); }
.photo .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--orange); opacity: .5; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; opacity: 0; transform: scale(1.05); transition: opacity .6s var(--ease), transform 1s var(--ease); }
.photo img.is-loaded { opacity: 1; transform: none; }
.pc-media { position: relative; display: block; width: 100%; aspect-ratio: 1 / .86; border: 0; padding: 0; overflow: hidden; background: var(--cream); }
.pc-media .photo { position: absolute; inset: 0; }
.product-card:hover .photo img.is-loaded { transform: scale(1.06); }
.pc-tag { position: absolute; z-index: 2; left: 10px; top: 10px; }
.pc-tag .chip { background: var(--orange); color: #1C1917; }
.pc-rate { position: absolute; z-index: 2; right: 10px; top: 10px; display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: 999px; background: var(--surface); font-size: .76rem; font-weight: 600; box-shadow: var(--shadow-sm); }
.pc-rate svg { color: var(--yellow); }
.pc-body { display: flex; flex-direction: column; gap: 6px; padding: 14px; flex: 1; }
.pc-body p { font-size: .84rem; color: var(--muted); line-height: 1.45; }
.pc-foot { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pc-foot .price small { font-size: .7rem; font-weight: 600; color: var(--muted); margin-right: 3px; }
.product-card.is-soldout .pc-media { filter: grayscale(.8); opacity: .75; }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 20px 8px; margin-inline: -20px; scrollbar-width: none; scroll-snap-type: x proximity; }

const I18n = {
  lang: 'en',
  strings: STRINGS,
  register(code, dict) { this.strings[code] = { ...(this.strings[code] || {}), ...dict }; },   // future: load from backend
  t(key, vars) {
    let s = this.strings[this.lang]?.[key] ?? this.strings.en[key] ?? key;
    if (vars) for (const k in vars) s = s.replaceAll(`{${k}}`, vars[k]);
    return s;
  },
  // Picks the current-language value from backend-style content: { en: '…', am: '…', om: '…' }
  loc(field) {
    if (field == null) return '';
    if (typeof field === 'string') return field;
    return field[this.lang] || field.en || Object.values(field)[0] || '';
  },
  set(code) {
    if (!this.strings[code]) return;
    this.lang = code;
    document.documentElement.lang = CONFIG.languages.find(l => l.code === code)?.htmlLang || 'en';
    safeStorage.set(CONFIG.storageKeys.lang, code);
  },
};
const t = (k, v) => I18n.t(k, v);
const loc = f => I18n.loc(f);

const safeStorage = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage unavailable: ignore */ } },
};

const attrs = (o = {}) => Object.entries(o).filter(([, v]) => v !== undefined && v !== null && v !== false).map(([k, v]) => `${k}="${esc(v === true ? '' : v)}"`).join(' ');
const dataAttrs = (o = {}) => Object.entries(o).map(([k, v]) => `data-${k.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}="${esc(v)}"`).join(' ');
const uid = (() => { let n = 0; return (p = 'id') => `${p}-${++n}`; })();
function formatPrice(n, currency = Store?.state?.restaurant?.currency || 'ETB') { return `${currency} ${Number(n).toLocaleString('en-US')}`; }

  try { return new Date(iso).toLocaleDateString(l, { day: 'numeric', month: 'short', year: 'numeric' }); } catch { return new Date(iso).toLocaleDateString('en-GB'); }

/* =========================================================
   src/data  — demo data now lives in data/mock-data.js
   Nothing in the UI reads MOCK directly; everything goes
   through the `Api` service layer below. When a real backend
   exists, switch CONFIG.api.mode to 'remote' and this can go.

const MOCK = window.ADAMA_MOCK;
if (!MOCK) console.error('data/mock-data.js did not load. Check the <script src> path.');

/* =========================================================
   src/services/api.js
   THE ONLY PLACE THAT KNOWS WHERE DATA COMES FROM.
   Pages and components call these functions and never touch
   MOCK directly. To connect a backend, set CONFIG.api.mode to
   'remote' and make sure each endpoint below returns the same
   shape as the mock.
   ========================================================= */
/* Demo persistence: admin edits are kept in this browser so they survive a refresh.
   Disappears with the mock layer; the real backend stores the data instead. */
const MockDB = {
  key: 'adama.mockdb.v1', keys: ['restaurant', 'categories', 'products', 'reviews', 'delivery', 'payment', 'orders'],
  load() { try { const d = JSON.parse(safeStorage.get(this.key) || 'null'); if (d) this.keys.forEach(k => { if (d[k] !== undefined) MOCK[k] = d[k]; }); } catch { /* ignore bad data */ } },
  save(v) { safeStorage.set(this.key, JSON.stringify(Object.fromEntries(this.keys.map(k => [k, MOCK[k]])))); return v; },
  reset() { try { localStorage.removeItem(this.key); } catch { /* ignore */ } location.reload(); },
};
/* Orders that ship inside mock-data.js are demo content, not this visitor's orders. Snapshot their ids before MockDB.load() restores saved data. Only used by the Delivery page. */
const DEMO_ORDER_IDS = new Set(CONFIG.api.mode === 'mock' ? (MOCK.orders || []).map(o => o.id) : []);
MockDB.load();

class ApiError extends Error {
  constructor(message, { status = 500, fields = {} } = {}) { super(message); this.name = 'ApiError'; this.status = status; this.fields = fields; }
}

async function request(path, { method = 'GET', body, mock } = {}) {
  if (CONFIG.api.mode === 'mock') {
    const [a, b] = CONFIG.api.latency;
    await sleep(a + Math.random() * (b - a));
    return clone(await mock());
  }
  const res = await fetch(CONFIG.api.baseUrl + path, {
    method, headers: { 'Content-Type': 'application/json' }, credentials: 'include',
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(data.message || 'Request failed', { status: res.status, fields: data.fields });
  return data;
}

/* Delivery pricing lives in ONE function, used by the UI for the live preview and by the
   server (mock now, real backend later) which must always recompute it from its own settings. */
const DELIVERY_OPTIONS = ['normal', 'fast'];
const DELIVERY_COMING_SOON = false;   // rider delivery is not live yet: no delivery fee is added and the Normal/Fast choice is hidden at checkout
const PHONE_RE = /^[+\d][\d\s()-]{6,}$/;
const deliveryCfg = s => ({ fastSurcharge: 30, fastEstimatedMinutes: { min: 15, max: 25 }, ...s });
function calcDeliveryFee(subtotal, option, settings) {
  const c = deliveryCfg(settings); if (!subtotal || DELIVERY_COMING_SOON) return 0;
  const base = subtotal >= c.freeDeliveryThreshold ? 0 : c.fee;     // free-delivery threshold waives the normal fee only
  return base + (option === 'fast' ? c.fastSurcharge : 0);
}

/* A product only needs id, categoryId, name, price. Everything else is optional,
   so a brand-new item added in the data or admin never breaks a page. */
const normalizeProduct = p => ({
  isAvailable: true, featured: false, rating: 0, reviewCount: 0, imageUrl: null, ...p,
  rating: Number(p.rating) || 0, reviewCount: Number(p.reviewCount) || 0,
  imageUrl: typeof p.imageUrl === 'string' && p.imageUrl.trim() ? p.imageUrl.trim() : null,
  description: p.description || null,
});

/* Product source of truth: Supabase rows (snake_case) merged onto the matching mock product (camelCase),
   matched by product id. Priority: Supabase value -> mock value. Used by the menu, product details,
   cart, checkout and admin lists, so every part of the UI sees the same product shape. */
const PRODUCT_FIELD_MAP = { category_id: 'categoryId', image_url: 'imageUrl', is_available: 'isAvailable', prep_minutes: 'prepMinutes', prep_minutes_max: 'prepMinutesMax', review_count: 'reviewCount' };
const PRODUCT_NUMERIC = ['price', 'rating', 'reviewCount', 'prepMinutes', 'prepMinutesMax'];
const PRODUCT_ZERO_IS_EMPTY = ['rating', 'reviewCount', 'prepMinutes', 'prepMinutesMax'];   // a 0 default means "no data yet"
const hasProductValue = v => v !== undefined && v !== null && !(typeof v === 'string' && !v.trim());
function mapSupabaseProduct(row) {
  const out = {};
  for (const [k, v] of Object.entries(row || {})) {
    const key = PRODUCT_FIELD_MAP[k] || k;
    if (!hasProductValue(v) || hasProductValue(out[key])) continue;
    out[key] = PRODUCT_NUMERIC.includes(key) && Number.isFinite(Number(v)) ? Number(v) : v;
  }
  PRODUCT_ZERO_IS_EMPTY.forEach(k => { if (out[k] === 0) delete out[k]; });
  return out;
}
function mergeProducts(rows) {
  const mocks = (window.ADAMA_MOCK?.products || []).map(clone), byId = new Map((rows || []).map(r => [r?.id, r]));
  const merged = mocks.map(m => normalizeProduct({ ...m, ...mapSupabaseProduct(byId.get(m.id)) }));      // mock order kept
  const known = new Set(mocks.map(m => m.id));
  (rows || []).filter(r => r && !known.has(r.id)).forEach(r => merged.push(normalizeProduct(mapSupabaseProduct(r))));   // Supabase-only products
  return merged;
}

/* ---------------------------------------------------------
   Supabase read-side content: categories, restaurant info, delivery settings, payment settings.
   Same strategy as products: read the table -> normalize to the app's shape -> merge onto the matching
   mock record (Supabase value first, mock value as fallback). If a table is missing, empty or the
   request fails, the complete mock data is used. Unknown columns are ignored; missing ones fall back.
   --------------------------------------------------------- */
const hasValue = hasProductValue;
const isPlainObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const camelKey = k => String(k).replace(/_([a-z0-9])/g, (_, c) => c.toUpperCase());
async function readTable(table) {
  try {
    const { data, error } = await supabaseClient.from(table).select('*');
    if (error) { console.warn(`Supabase "${table}" unavailable, using mock data:`, error.message); return []; }
    return Array.isArray(data) ? data.filter(isPlainObj) : [];
  } catch (e) { console.warn(`Supabase "${table}" failed, using mock data:`, e); return []; }
}
/* One row -> camelCase keys, empty values dropped (first value wins when both spellings exist). */
function camelRow(row) {
  const out = {};
  for (const [k, v] of Object.entries(row || {})) { const key = camelKey(k); if (hasValue(v) && !hasValue(out[key])) out[key] = v; }
  return out;
}
const pickValue = (c, ...keys) => { for (const k of keys) if (hasValue(c[k])) return c[k]; return undefined; };
const toNum = v => (hasValue(v) && typeof v !== 'boolean' && Number.isFinite(Number(v))) ? Number(v) : undefined;
const toBool = v => typeof v === 'boolean' ? v : (v === 'true' || v === 1 || v === '1') ? true : (v === 'false' || v === 0 || v === '0') ? false : undefined;
const hhmm = v => { const m = /^(\d{1,2}):(\d{2})/.exec(String(v ?? '')); return m ? `${m[1].padStart(2, '0')}:${m[2]}` : undefined; };
const defined = o => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined));
/* Translated text: accepts { en, am, om }, a plain string (= English), or name_en / name_am / name_om columns. */
function rowLoc(row, base) {
  const out = {};
  const direct = row?.[base];
  if (isPlainObj(direct)) Object.entries(direct).forEach(([k, v]) => { if (hasValue(v)) out[k] = v; });
  else if (hasValue(direct) && typeof direct === 'string') out.en = direct;
  ['en', 'am', 'om'].forEach(l => { const v = row?.[`${base}_${l}`]; if (hasValue(v)) out[l] = v; });
  return out;
}
const mergeLoc = (mockVal, dbVal) => {
  const m = isPlainObj(mockVal) ? mockVal : (typeof mockVal === 'string' ? { en: mockVal } : {});
  return { ...m, ...(dbVal || {}) };
};

/* ---- categories: { id, icon, name: { en, am, om } } ---- */
function mergeCategories(rows) {
  const mocks = clone(window.ADAMA_MOCK?.categories || []), byId = new Map();
  rows.forEach(r => { if (hasValue(r.id)) byId.set(String(r.id), r); });
  const build = (m, r) => {
    const c = camelRow(r), id = m?.id ?? String(r.id);
    return { ...(m || {}), id, ...defined({ icon: typeof c.icon === 'string' ? c.icon : undefined }),
      name: mergeLoc(m?.name || { en: id }, rowLoc(r, 'name')) };
  };
  const merged = mocks.map(m => build(m, byId.get(String(m.id))));            // mock order kept
  const known = new Set(mocks.map(m => String(m.id)));
  const order = r => toNum(pickValue(camelRow(r), 'sortOrder', 'position', 'displayOrder')) ?? 1e6;
  [...byId.values()].filter(r => !known.has(String(r.id))).map((r, n) => ({ r, n })).sort((a, b) => order(a.r) - order(b.r) || a.n - b.n)
    .forEach(({ r }) => merged.push(build(null, r)));                          // Supabase-only categories
  return merged;
}

/* ---- restaurant: single record (first row of restaurant_settings) ---- */
function mergeRestaurant(rows) {
  const m = clone(window.ADAMA_MOCK?.restaurant || {}), row = rows[0];
  if (!row) return m;
  const c = camelRow(row), hoursObj = isPlainObj(c.hours) ? c.hours : {}, coordObj = isPlainObj(c.coordinates) ? c.coordinates : {};
  const open = hhmm(pickValue({ ...c, ...hoursObj }, 'open', 'openTime', 'openingTime', 'opensAt'));
  const close = hhmm(pickValue({ ...c, ...hoursObj }, 'close', 'closeTime', 'closingTime', 'closesAt'));
  const hours = { ...(m.hours || {}), ...defined({ open, close }) };
  const dbLabel = rowLoc(hoursObj, 'label');
  const labelFromRow = rowLoc(row, 'hours_label');
  if (Object.keys(dbLabel).length || Object.keys(labelFromRow).length) hours.label = mergeLoc(m.hours?.label, { ...labelFromRow, ...dbLabel });
  else if (open || close) hours.label = mergeLoc(m.hours?.label, { en: `Every day, ${hours.open} to ${hours.close}` });
  const lat = toNum(pickValue({ ...c, ...coordObj }, 'lat', 'latitude')), lng = toNum(pickValue({ ...c, ...coordObj }, 'lng', 'lon', 'longitude'));
  return { ...m,
    ...defined({ name: pickValue(c, 'name', 'restaurantName'), currency: pickValue(c, 'currency'), phone: pickValue(c, 'phone'), email: pickValue(c, 'email'),
      ctaImageUrl: pickValue(c, 'ctaImageUrl', 'ctaImage'),

      highlights: Array.isArray(c.highlights) && c.highlights.length ? c.highlights : undefined }),
    tagline: mergeLoc(m.tagline, rowLoc(row, 'tagline')),
    address: mergeLoc(m.address, rowLoc(row, 'address')),
    coordinates: { ...(m.coordinates || {}), ...defined({ lat, lng }) },
    hours };
}

/* ---- delivery settings: single record (first row of delivery_settings) ---- */
function mergeDelivery(rows) {
  const m = clone(window.ADAMA_MOCK?.delivery || {}), row = rows[0];
  if (!row) return m;
  const c = camelRow(row);
  const range = (obj, minKeys, maxKeys, base) => {
    const o = isPlainObj(obj) ? obj : {};
    return { ...base, ...defined({ min: toNum(pickValue({ ...c, ...o }, 'min', ...minKeys)), max: toNum(pickValue({ ...c, ...o }, 'max', ...maxKeys)) }) };
  };
  const areasRaw = c.areas, areas = (Array.isArray(areasRaw) ? areasRaw : typeof areasRaw === 'string' ? areasRaw.split(/[\n,]/) : [])
    .map(x => String(x).trim()).filter(Boolean);
  return { ...m, ...defined({
      enabled: toBool(pickValue(c, 'enabled', 'deliveryEnabled', 'isEnabled')),
      fee: toNum(pickValue(c, 'fee', 'deliveryFee')),
      freeDeliveryThreshold: toNum(pickValue(c, 'freeDeliveryThreshold', 'freeDeliveryFrom', 'freeDeliveryMin')),
      minOrder: toNum(pickValue(c, 'minOrder', 'minimumOrder', 'minOrderAmount')),
      fastSurcharge: toNum(pickValue(c, 'fastSurcharge', 'fastDeliveryFee', 'fastFee')),
      areas: areas.length ? areas : undefined }),
    estimatedMinutes: range(c.estimatedMinutes ?? c.eta, ['etaMin', 'estimatedMin', 'estimatedMinutesMin'], ['etaMax', 'estimatedMax', 'estimatedMinutesMax'], m.estimatedMinutes),
    fastEstimatedMinutes: range(c.fastEstimatedMinutes ?? c.fastEta, ['fastEtaMin', 'fastEstimatedMin', 'fastEstimatedMinutesMin'], ['fastEtaMax', 'fastEstimatedMax', 'fastEstimatedMinutesMax'], m.fastEstimatedMinutes) };
}

/* ---- payment settings: { cod: { enabled }, telebirr: { enabled, accountNumber, accountName, instructions } }
   Accepts one row with nested json (cod / telebirr), one flat row (telebirr_account_number ...),
   or one row per method (method = 'cod' | 'telebirr'). ---- */
function paymentInstructions(v) {
  const list = Array.isArray(v) ? v : typeof v === 'string' ? v.split('\n') : [];
  return list.map(x => isPlainObj(x) ? x : { en: String(x).trim() }).filter(x => Object.values(x).some(hasValue));
}
function mergePayment(rows) {
  const m = clone(window.ADAMA_MOCK?.payment || {}), db = { cod: {}, telebirr: {} };
  const take = (target, o) => Object.assign(target, defined({ enabled: toBool(pickValue(o, 'enabled', 'isEnabled', 'active')) }));
  const takeTb = (o, prefix) => {
    const k = n => prefix ? prefix + n[0].toUpperCase() + n.slice(1) : n;
    take(db.telebirr, prefix ? { enabled: o[k('enabled')] } : o);
    const num = pickValue(o, k('accountNumber'), k('account')), name = pickValue(o, k('accountName'));
    const ins = paymentInstructions(pickValue(o, k('instructions')));
    Object.assign(db.telebirr, defined({ accountNumber: hasValue(num) ? String(num) : undefined, accountName: hasValue(name) ? String(name) : undefined, instructions: ins.length ? ins : undefined }));
  };
  rows.map(camelRow).forEach(c => {
    const method = String(c.method ?? c.provider ?? '').toLowerCase();
    if (method === 'cod' || method === 'cash') take(db.cod, c);
    else if (method === 'telebirr') takeTb(c, '');
    else {
      if (isPlainObj(c.cod)) take(db.cod, camelRow(c.cod)); else take(db.cod, { enabled: pickValue(c, 'codEnabled', 'cashEnabled', 'cashOnDeliveryEnabled') });
      if (isPlainObj(c.telebirr)) takeTb(camelRow(c.telebirr), ''); else takeTb(c, 'telebirr');
    }
  });
  return { ...m, cod: { ...(m.cod || {}), ...db.cod }, telebirr: { ...(m.telebirr || {}), ...db.telebirr } };
}

/* ---- reviews: Supabase `reviews` table -> the app's review shape { id, author, rating, date, verified, text, status }
   Same strategy as products/settings: read the table, normalize field names (snake_case / aliases), keep only
   reviews that are public (status 'approved', same rule as the mock layer), and fall back to the mock reviews
   when Supabase is unavailable or has no usable public review. Supabase and mock reviews are never mixed, so
   nothing is listed twice. Extra fields (productId, orderId, imageUrl) are kept for later use. ---- */
const REVIEW_COLUMNS = { author: 'customer_name', text: 'comment', rating: 'rating', status: 'status', productId: 'product_id', orderId: 'order_id', imageUrl: 'image_url' };   // columns written by submitReview (created_at uses the table default)
const reviewIsPublic = r => (r.status || 'approved') === 'approved';
function mapSupabaseReview(row, i = 0) {
  const c = camelRow(row), rating = toNum(pickValue(c, 'rating', 'stars', 'score')), text = pickValue(c, 'text', 'comment', 'body', 'review', 'message');
  if (!(rating >= 1 && rating <= 5) || typeof text !== 'string' || !text.trim()) return null;   // not usable
  const flag = toBool(pickValue(c, 'isApproved', 'approved')), rawDate = pickValue(c, 'createdAt', 'date', 'submittedAt', 'timestamp');
  const author = pickValue(c, 'author', 'customerName', 'authorName', 'name', 'userName');
  return { id: hasValue(c.id) ? String(c.id) : `sb-${i}`, author: hasValue(author) ? String(author).trim() || 'Guest' : 'Guest', rating: Math.round(rating), text: text.trim(),
    date: rawDate && !Number.isNaN(Date.parse(rawDate)) ? new Date(rawDate).toISOString() : '', verified: toBool(pickValue(c, 'verified', 'isVerified')) ?? false,
    status: String(pickValue(c, 'status') ?? (flag === false ? 'pending' : 'approved')).toLowerCase(),
    ...defined({ productId: hasValue(pickValue(c, 'productId')) ? String(c.productId) : undefined, orderId: hasValue(pickValue(c, 'orderId')) ? String(c.orderId) : undefined, imageUrl: pickValue(c, 'imageUrl', 'image', 'photoUrl') }) };
}
const reviewKey = r => [r.author, r.rating, r.text].map(x => String(x).trim().toLowerCase()).join('|');
function mergeReviews(rows) {   // Supabase rows -> unique, public, newest first
  const seen = new Set(), out = [];
  (rows || []).map(mapSupabaseReview).filter(r => r && reviewIsPublic(r)).sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0))
    .forEach(r => { if (!seen.has(r.id)) { seen.add(r.id); out.push(r); } });
  return out;
}
const summarizeReviews = items => ({ average: items.length ? Math.round(items.reduce((s, r) => s + r.rating, 0) / items.length * 10) / 10 : 0, count: items.length });
/* Short-lived cache so the homepage and the product list share one request; cleared when a review is submitted. */
const ReviewCache = { promise: null, at: 0 };
function loadPublicReviews() {
  if (!ReviewCache.promise || Date.now() - ReviewCache.at > 15000) { ReviewCache.at = Date.now(); ReviewCache.promise = readTable('reviews').then(mergeReviews).catch(() => []); }
  return ReviewCache.promise;
}
/* The visitor's own submissions in this browser tab. New reviews are 'pending' until staff approve them, so the
   public list cannot include them yet; keeping them here makes the new review appear immediately for the person
   who wrote it. Entries are skipped once the same review is in the public list (no duplicates). */
const MyReviews = {
  key: 'adama.myreviews.v1',
  list() { try { const d = JSON.parse(sessionStorage.getItem(this.key) || '[]'); return Array.isArray(d) ? d.filter(r => r && r.author && r.text) : []; } catch { return []; } },
  add(r) { try { sessionStorage.setItem(this.key, JSON.stringify([r, ...this.list()].slice(0, 20))); } catch { this._mem = [r, ...(this._mem || [])]; } },
  all() { return [...this.list(), ...(this._mem || [])]; },
};
/* A product that has no stored rating gets one from the public reviews that reference it (product_id). */
function applyReviewStats(products, reviews) {
  const by = new Map();
  reviews.filter(r => r.productId).forEach(r => { (by.get(r.productId) || by.set(r.productId, []).get(r.productId)).push(r.rating); });
  if (!by.size) return products;
  return products.map(p => { const l = by.get(String(p.id)); return l && !(p.rating > 0) ? { ...p, rating: Math.round(l.reduce((a, b) => a + b, 0) / l.length * 10) / 10, reviewCount: l.length } : p; });
}

/* ---- customer authentication: Supabase Google OAuth (signInWithOAuth). The Supabase session is stored by
   supabase-js itself; the app's session is { id, name, email, phone, avatarUrl, bio, role } built from the auth user +
   the user's `profiles` row (id = auth user id). The role is a UI hint only: RLS must keep customers from editing `role`.
   Profile rules: the row is created on first login from the Google account; later logins only fill BLANK fields
   (never overwrite what the customer typed); the edit form is the only thing that replaces existing values. ---- */
const PROFILE_COLUMNS = { id: 'id', name: 'full_name', email: 'email', phone: 'phone', avatar: 'avatar_url', bio: 'bio' };   // columns used in `profiles`
const PROFILE_OPTIONAL = ['avatar', 'bio'];   // may be missing from the table: they are dropped automatically (no new table, no failed save)
const profileSupport = { avatar: true, bio: true };   // flips to false once Supabase says a column does not exist
let authBusy = 0;   // > 0 while this tab runs sign-out itself, so onAuthStateChange does not repeat the work
const authError = (e, fallback = 'Authentication failed') => new ApiError(e?.message || fallback, { status: e?.status || 500 });
const cleanText = v => (typeof v === 'string' ? v.trim() : '');
const isMissingColumn = e => !!e && (e.code === 'PGRST204' || e.code === '42703' || /column .*(does not exist|schema cache)|could not find the .* column/i.test(e.message || ''));
/* Used only while Supabase cannot be reached (offline / blocked): edits are kept in this browser so the demo keeps working. */
const LocalProfile = {
  key: id => `adama.profile.local.${id}`,
  get(id) { try { const d = JSON.parse(safeStorage.get(this.key(id)) || 'null'); return isPlainObj(d) ? d : null; } catch { return null; } },
  set(id, v) { safeStorage.set(this.key(id), JSON.stringify(v)); },
  clear(id) { try { localStorage.removeItem(this.key(id)); } catch { /* storage unavailable: ignore */ } },
};
async function readProfileState(userId) {   // { row, ok }: ok is false when the read itself failed (so a missing row is not assumed)
  try {
    const { data, error } = await supabaseClient.from('profiles').select('*').eq(PROFILE_COLUMNS.id, userId).maybeSingle();
    if (error) { console.warn('Supabase "profiles" unavailable:', error.message); return { row: null, ok: false }; }
    const row = isPlainObj(data) ? data : null;
    if (row) PROFILE_OPTIONAL.forEach(k => { if (!(PROFILE_COLUMNS[k] in row)) profileSupport[k] = false; });   // select('*') shows which columns exist
    return { row, ok: true };
  } catch (e) { console.warn('Supabase "profiles" failed:', e); return { row: null, ok: false }; }
}
/* Runs a profiles write; if Supabase reports a missing optional column, retries once without it. Returns the error or null. */
async function profileWrite(run) {
  let { error } = await run(profileSupport);
  if (error && isMissingColumn(error)) {
    const hit = PROFILE_OPTIONAL.filter(k => profileSupport[k] && (error.message || '').includes(PROFILE_COLUMNS[k]));
    (hit.length ? hit : PROFILE_OPTIONAL).forEach(k => { profileSupport[k] = false; });
    ({ error } = await run(profileSupport));
  }
  return error || null;
}
function googleInfo(user) {
  const m = user?.user_metadata || {};
  return { name: cleanText(m.full_name || m.name), phone: cleanText(user?.phone || m.phone || m.phone_number), avatar: cleanText(m.avatar_url || m.picture) };
}
/* Login sync. No row yet -> create it from the Google account. Row exists -> fill only blank fields; a phone number or
   any other value the customer already has is never replaced by (possibly empty) Google data. */
async function syncProfile(user, state) {
  if (!state.ok) return null;
  const g = googleInfo(user), C = PROFILE_COLUMNS;
  if (!state.row) {
    const err = await profileWrite(sup => supabaseClient.from('profiles').upsert(
      { [C.id]: user.id, [C.name]: g.name || null, [C.email]: user.email || null, [C.phone]: g.phone || null,
        ...(sup.avatar && g.avatar ? { [C.avatar]: g.avatar } : {}) },
      { onConflict: C.id, ignoreDuplicates: true }));   // ignoreDuplicates: a second tab can never overwrite a row created a moment earlier
    if (err) { console.warn('Supabase "profiles" could not be created:', err.message); return null; }
    return (await readProfileState(user.id)).row;
  }
  const row = state.row, patch = {};
  if (!cleanText(row[C.name]) && g.name) patch[C.name] = g.name;
  if (!cleanText(row[C.phone]) && g.phone) patch[C.phone] = g.phone;
  if (profileSupport.avatar && !cleanText(row[C.avatar]) && g.avatar) patch[C.avatar] = g.avatar;
  if (user.email && row[C.email] !== user.email) patch[C.email] = user.email;   // the sign-in email is the source of truth
  if (!Object.keys(patch).length) return row;
  const err = await profileWrite(sup => {
    const body = { ...patch }; if (!sup.avatar) delete body[C.avatar];
    return Object.keys(body).length ? supabaseClient.from('profiles').update(body).eq(C.id, user.id) : Promise.resolve({ error: null });
  });
  if (err) { console.warn('Supabase "profiles" could not be updated:', err.message); return row; }
  return { ...row, ...patch };
}
function sessionFromUser(user, row) {
  const c = camelRow(row || {}), meta = user?.user_metadata || {}, g = googleInfo(user);
  return { id: user.id, name: String(pickValue(c, 'fullName', 'name') ?? meta.full_name ?? meta.name ?? (user.email || '').split('@')[0] ?? ''),

/* Auth user -> app session: read the profile from Supabase, sync it, and fall back to the Google account data

/* ---------------------------------------------------------
   Customer orders  ->  Supabase `orders` + `order_items` (see supabase-orders.sql).
   - Checkout:  priceOrder() validates and RE-PRICES everything from the same product / delivery data the menu
     uses, then the `place_order` database function re-checks prices and the delivery fee on the server and
     inserts the order + its items in one transaction. It works for guests (user_id stays null) and for
     signed-in customers (user_id = auth.uid(), set by the database, never by the browser).
   - History:   Api.getMyOrders() reads only the signed-in customer's rows (RLS enforces it as well).
   - Fallback:  if Supabase cannot be reached the order is saved to the mock store exactly as before.
   Admin order screens, payment screenshots and payment approval still use the mock layer.
   --------------------------------------------------------- */
const GUEST_ORDERS_KEY = 'adama.guestorders.v1', GUEST_ORDER_TTL = 24 * 3600 * 1000;
const GuestOrders = {   // guests cannot read their order back from Supabase (no account), so this device remembers it for tracking
  list() {
    try {
      const v = JSON.parse(safeStorage.get(GUEST_ORDERS_KEY) || '[]'), now = Date.now();
      return Array.isArray(v) ? v.filter(o => o && o.id && Array.isArray(o.items) && now - (Date.parse(o.createdAt) || 0) < GUEST_ORDER_TTL) : [];
    } catch { return []; }
  },
  add(o) { safeStorage.set(GUEST_ORDERS_KEY, JSON.stringify([o, ...this.list().filter(x => x.id !== o.id)].slice(0, 10))); },
  save(list) { safeStorage.set(GUEST_ORDERS_KEY, JSON.stringify(list.slice(0, 10))); },
  /* Guests have no account, so RLS hides their order. `track_orders` returns the current status when BOTH the order number and the
     phone number given at checkout match. If it cannot be reached, the status last seen on this device is kept. */
  async refresh() {
    const list = this.list(), open = list.filter(o => o.source === 'supabase' && o.status !== 'delivered' && o.customer?.phone);
    if (!open.length) return list;
    try {
      const { data, error } = await supabaseClient.rpc('track_orders', { p_orders: open.map(o => ({ order_number: o.id, phone: o.customer.phone })) });
      if (error) throw error;
      const live = new Map((Array.isArray(data) ? data : []).map(r => [r.order_number, r]));
      let changed = false;
      list.forEach(o => {
        const r = live.get(o.id); if (!r) return;
        if (CONFIG.orderSteps.includes(r.status) && r.status !== o.status) { o.status = r.status; changed = true; }
        if (r.payment_status && o.payment && r.payment_status !== o.payment.status) { o.payment.status = r.payment_status; changed = true; }
      });
      if (changed) this.save(list);
    } catch (e) { console.warn('Supabase order tracking unavailable, showing the last known status:', e?.message || e); }
    return list;
  },
};

/* One Supabase row (orders + nested order_items) -> the app's order shape. `id` is the customer-facing order number. */
function orderFromRow(r) {
  const n = v => Number(v) || 0, method = r.payment_method === 'telebirr' ? 'telebirr' : 'cod', fee = n(r.delivery_fee);
  const items = (Array.isArray(r.order_items) ? r.order_items : []).slice().sort((a, b) => n(a.id) - n(b.id))
    .map(i => ({ productId: i.product_id, name: i.name, qty: n(i.qty), price: n(i.price) }));
  return {
    id: r.order_number || String(r.id), dbId: r.id, source: 'supabase',
    status: CONFIG.orderSteps.includes(r.status) ? r.status : 'received', createdAt: r.created_at,
    items, subtotal: n(r.subtotal), fee, total: n(r.total),
    customer: { name: r.customer_name || '', phone: r.customer_phone || '' },
    delivery: { option: r.delivery_option === 'fast' ? 'fast' : 'normal', address: r.address || '', notes: r.notes || '',
      coords: r.lat != null && r.lng != null ? { lat: n(r.lat), lng: n(r.lng) } : null, fee },
    payment: { method, status: r.payment_status || (method === 'cod' ? 'pay_on_delivery' : 'awaiting_review'), amount: n(r.total), proof: null, reviewedAt: r.payment_reviewed_at || null },
  };
}

/* Validates the checkout payload and recalculates every number from the catalog + delivery settings
   (Supabase first, mock fallback). Nothing the browser sends for prices or fees is trusted. */
async function priceOrder(payload) {
  if (!payload.items?.length) throw new ApiError('Order is empty', { status: 422 });
  const c = payload.customer || {}, d = payload.delivery || {}, pay = payload.payment || { method: 'cod' }, fields = {};
  if (!c.name?.trim() || c.name.trim().length < 2) fields.name = 'checkout.errName';
  if (!PHONE_RE.test((c.phone || '').trim())) fields.phone = 'checkout.errPhone';
  if (!d.address?.trim() || d.address.trim().length < 5) fields.address = 'checkout.errAddress';
  if ((d.notes || '').length > 300) fields.notes = 'checkout.errNotes';
  if (!DELIVERY_OPTIONS.includes(d.option)) fields.deliveryOption = 'checkout.errOption';
  const tb = (await Api.getPaymentSettings()).telebirr || {};   // same settings the customer sees at checkout (Supabase first, mock fallback)
  if (!(pay.method === 'cod' || (pay.method === 'telebirr' && tb.enabled))) fields.paymentMethod = 'checkout.errMethod';
  else if (pay.method === 'telebirr' && !pay.proof?.url) fields.paymentProof = 'pay.needed';
  if (Object.keys(fields).length) throw new ApiError('Please check the highlighted fields', { status: 422, fields });
  const catalog = await Api.getProducts(), delivery = await Api.getDeliverySettings();
  const items = payload.items.map(i => {
    const p = catalog.find(x => x.id === i.productId), qty = Math.floor(Number(i.qty));
    if (!p) throw new ApiError('A product in your order is no longer available', { status: 422 });
    if (!(qty >= 1 && qty <= 99)) throw new ApiError('Invalid quantity', { status: 422 });
    return { productId: p.id, name: loc(p.name), qty, price: Number(p.price) };
  });
  const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
  if (subtotal < delivery.minOrder) throw new ApiError('Minimum order is ' + formatPrice(delivery.minOrder), { status: 422 });
  const fee = calcDeliveryFee(subtotal, d.option, delivery);
  return { items, subtotal, fee, total: subtotal + fee, customer: { name: c.name.trim(), phone: c.phone.trim() },
    delivery: { option: d.option, address: d.address.trim(), notes: (d.notes || '').trim(), coords: d.coords || null, fee }, payment: pay };
}

/* Real order. The database function re-prices items and recomputes the fee itself and returns the saved order. */
async function placeOrderInSupabase(p) {
  const { data: s } = await supabaseClient.auth.getSession(), signedIn = !!s?.session?.user;
  const body = {
    items: p.items.map(i => ({ productId: i.productId, qty: i.qty, price: i.price, name: i.name })),
    customer: p.customer, deliveryFee: p.fee,
    delivery: { option: p.delivery.option, address: p.delivery.address, notes: p.delivery.notes, coords: p.delivery.coords },
    payment: { method: p.payment.method },   // payment screenshots / approval are not part of this step
  };
  const { data, error } = await supabaseClient.rpc('place_order', { p_order: body });
  if (error) {
    if (error.code === '22023') throw new ApiError(error.message, { status: 422 });   // the database rejected the order itself: show it, do not fall back
    throw new Error(error.message || 'Supabase order failed');                         // anything else (offline, missing table, RLS): fall back to mock
  }
  const row = Array.isArray(data) ? data[0] : data;
  if (!row || !row.order_number) throw new Error('Supabase returned no order number');
  const order = orderFromRow(row);
  if (!signedIn) GuestOrders.add(order);
  return order;
}

  return MockDB.save(order);
}

    saveRestaurant: r => request('/admin/restaurant', { method: 'PUT', body: r, mock: () => { MOCK.restaurant = { ...MOCK.restaurant, ...r }; return MockDB.save(MOCK.restaurant); } }),
  },

  getProfile: async () => {
    const { data } = await supabaseClient.auth.getSession(), user = data?.session?.user;
    if (!user) throw new ApiError('Not signed in', { status: 401 });
    return { ...(await loadCustomer(user)), addresses: [] };
  },

  /** Customer edits their own profile. Validates, writes `profiles` in Supabase, and returns the fresh session.
      If Supabase cannot be reached the edit is kept on this device (result.localOnly = true) so the demo keeps working. */
  updateProfile: async input => {
    const { data } = await supabaseClient.auth.getSession(), user = data?.session?.user;
    if (!user) throw new ApiError('Not signed in', { status: 401 });
    const name = cleanText(input.name), phone = cleanText(input.phone), bio = cleanText(input.bio), fields = {};
    if (!name) fields.name = 'auth.errName';
    if (phone && !PHONE_RE.test(phone)) fields.phone = 'profile.errPhone';
    if (bio.length > 300) fields.bio = 'profile.errBio';
    if (Object.keys(fields).length) throw new ApiError('Invalid profile', { status: 422, fields });
    let error = null;
    try { error = await saveProfile(user, { name, phone, bio }); } catch (e) { error = e || new Error('Profile save failed'); }
    const base = Store.state.session || sessionFromUser(user, null);
    if (error) {
      console.warn('Supabase profile save failed, keeping the edit on this device:', error.message || error);
      LocalProfile.set(user.id, { name, phone, bio });
      return { ...base, name, phone, bio, localOnly: true };
    }
    LocalProfile.clear(user.id);
    const state = await readProfileState(user.id);   // confirm from Supabase what was stored
    return state.ok && state.row ? sessionFromUser(user, { ...state.row, ...(profileSupport.bio ? {} : { bio }) }) : { ...base, name, phone, bio };
  },

  auth: {
    /** Restores the real Supabase session (supabase-js keeps it in localStorage). Returns null when signed out. */
    getSession: async () => {
      try {
        const { data, error } = await supabaseClient.auth.getSession(), user = data?.session?.user;
        if (error || !user) return null;
        return await loadCustomer(user);
      } catch (e) { console.warn('Supabase getSession failed:', e); return null; }
    },
    /** Google-only sign-in: Supabase redirects to Google, then back to this site with the session in the URL. */
    signInWithGoogle: async () => {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin
        }
      });
      if (error) throw authError(error, 'Could not start Google sign-in');
    },
    signOut: async () => {
      authBusy++;
      try {
        const sid = Store.state.session?.id; if (sid) LocalProfile.clear(sid);   // nothing kept on this device after sign-out
        const { error } = await supabaseClient.auth.signOut();
        if (error) { console.warn('Supabase signOut failed, clearing the local session:', error.message); await supabaseClient.auth.signOut({ scope: 'local' }); }
        return { ok: true };
      } finally { authBusy--; }
    },
    /** Subscribe to Supabase auth events (sign-out in another tab, expired session, sign-in elsewhere). */
    onAuthStateChange: cb => supabaseClient.auth.onAuthStateChange((event, sb) => { if (!authBusy) cb(event, sb); }),
  },
};

   src/state/store.js
   ========================================================= */
const Store = {
  state: { restaurant: null, categories: [], session: null, cart: [] },
  subs: new Set(),
  set(patch) { Object.assign(this.state, patch); this.subs.forEach(fn => fn(patch)); },
  subscribe(fn) { this.subs.add(fn); return () => this.subs.delete(fn); },
};

const Cart = {
  load() {
    try { const raw = safeStorage.get(CONFIG.storageKeys.cart); const v = raw ? JSON.parse(raw) : []; if (Array.isArray(v)) Store.state.cart = v.filter(i => i && i.id && i.qty > 0); } catch { Store.state.cart = []; }
  },
  save() { safeStorage.set(CONFIG.storageKeys.cart, JSON.stringify(Store.state.cart)); },
  commit(cart) { Store.set({ cart }); this.save(); },
  add(p, qty = 1) {
    const cart = Store.state.cart.map(i => ({ ...i }));
    const found = cart.find(i => i.id === p.id);
    if (found) found.qty = Math.min(20, found.qty + qty);
    else cart.push({ id: p.id, name: p.name, imageUrl: p.imageUrl, categoryId: p.categoryId, price: p.price, qty });
    this.commit(cart);
  },
  setQty(id, qty) { this.commit(Store.state.cart.map(i => i.id === id ? { ...i, qty: Math.max(1, Math.min(20, qty)) } : i)); },
  remove(id) { this.commit(Store.state.cart.filter(i => i.id !== id)); },
  clear() { this.commit([]); },
  /** Re-reads each cart line from the live catalog, so an image/name/price changed in the
      backend shows up in the cart. Lines whose product no longer exists are dropped.
      Silent on purpose (no Store.set): it runs inside a page render. */
  sync(getProduct) {
    let changed = false;
    const next = [];
    for (const i of Store.state.cart) {
      const p = getProduct(i.id);
      if (!p) { changed = true; continue; }
      const fresh = { ...i, name: p.name, imageUrl: p.imageUrl, categoryId: p.categoryId, price: p.price };
      if (JSON.stringify(fresh) !== JSON.stringify(i)) changed = true;
      next.push(fresh);
    }
    if (changed) { Store.state.cart = next; this.save(); Chrome.updateBadges(); }
  },
  count: () => Store.state.cart.reduce((n, i) => n + i.qty, 0),
  subtotal: () => Store.state.cart.reduce((s, i) => s + i.price * i.qty, 0),
};

const Auth = {
  get session() { return Store.state.session; },
  // UI guard only; Supabase Auth + database RLS must enforce admin access in production.
  isAdmin() { return Store.state.session?.role === 'admin'; },
};

function showFieldErrors(form, errors, { focus = true } = {}) {

  let first = null;

    f.classList.add('has-error'); const e = f.querySelector('.error'); e.hidden = false; e.innerHTML = `${Icon('alert', 14)}<span>${esc(msg)}</span>`;

const stepIndex = status => Math.max(0, CONFIG.orderSteps.indexOf(status));
/* "Preparing - Step 2 of 4 - Your food is being cooked fresh." Plain text, so the live update can swap it in place. */

function trapTab(e, container) {

  if (!f.length) return;

}

const Modal = {

   src/lib/reveal.js  — scroll reveal (fade / slide / scale)
   ========================================================= */
const Reveal = {
  io: null,
  observe(root = document, instant = false) {
    const els = [...root.querySelectorAll('.reveal:not(.is-visible)')];
    if (instant || prefersReducedMotion() || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('is-visible')); return; }
    this.io ??= new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('is-visible'); this.io.unobserve(en.target); } }), { threshold: .12, rootMargin: '0px 0px -5% 0px' });
    els.forEach(e => this.io.observe(e));
  },
};

      <div class="hero-arrows"><button type="button" class="icon-btn" data-hero-go="prev" aria-label="${esc(t('home.prev'))}">${Icon('chevronLeft')}</button><button type="button" class="icon-btn" data-hero-go="next" aria-label="${esc(t('home.next'))}">${Icon('chevronRight')}</button></div></div></section>`;
}
function mountHero(root) {
  const track = root.querySelector('.hero-track'), slides = [...root.querySelectorAll('.hero-slide')], dots = [...root.querySelectorAll('.dot')];
  let i = 0, timer = null, x0 = null;
  const stop = () => clearInterval(timer);
  const play = () => { stop(); if (!prefersReducedMotion()) timer = setInterval(() => go(i + 1), 6500); };
  function go(n) {
    i = (n + slides.length) % slides.length; track.style.setProperty('--i', i);
    slides.forEach((s, k) => { const on = k === i; s.classList.toggle('is-active', on); if (on) { s.removeAttribute('inert'); s.removeAttribute('aria-hidden'); } else { s.setAttribute('inert', ''); s.setAttribute('aria-hidden', 'true'); } });
    dots.forEach((d, k) => d.setAttribute('aria-current', String(k === i))); root.dataset.theme = slides[i].dataset.theme;
  }
  const onClick = e => { const b = e.target.closest('[data-hero-go]'); if (!b) return; const v = b.dataset.heroGo; go(v === 'next' ? i + 1 : v === 'prev' ? i - 1 : +v); play(); };
  const onDown = e => { x0 = e.clientX; }, onUp = e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) { go(i + (dx < 0 ? 1 : -1)); play(); } };
  const onVis = () => document.hidden ? stop() : play();
  root.addEventListener('click', onClick); root.addEventListener('pointerdown', onDown); root.addEventListener('pointerup', onUp);
  root.addEventListener('mouseenter', stop); root.addEventListener('mouseleave', play); root.addEventListener('focusin', stop); root.addEventListener('focusout', play);
  document.addEventListener('visibilitychange', onVis); go(0); play();
  return () => { stop(); document.removeEventListener('visibilitychange', onVis); };
}

/* Downscale to a JPEG so the demo can keep it in browser storage. The backend version uploads the original file instead. */
function imageToProof(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/') || file.size > 10 * 1024 * 1024) return reject(new Error('pay.errFile'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, 1000 / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); resolve({ name: file.name, dataUrl: cv.toDataURL('image/jpeg', .72) }); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('pay.errRead')); };
    img.src = url;
  });
}

   src/pages/Delivery.js — cart, summary, order tracking
   ========================================================= */
Pages.delivery = {
  title: () => t('nav.delivery'), reactiveCart: true,
  async render(ctx) {
    // Orders are read-only here; if the orders request fails (e.g. a guest) the page still shows delivery information.
    const [settings, orders, payment] = await Promise.all([Api.getDeliverySettings(), Api.getMyOrders().catch(() => []), Api.getPaymentSettings(), loadProducts()]);
    Cart.sync(id => Catalog.get(id));
    ctx.data = { settings, orders: (Array.isArray(orders) ? orders : []).filter(o => !DEMO_ORDER_IDS.has(o.id)), payment }; return this.view(ctx);
  },
  /* While the page is open, re-read the status of active orders and move the tracker in place (no repaint, so a half-filled
     checkout form is never lost). The cached page data is updated too, so a later repaint keeps the new step. */
  mount(el, ctx) {
    const ms = Number(CONFIG.trackPollMs); if (!(ms > 0)) return null;
    let busy = false, stopped = false;
    const tick = async () => {
      if (busy || stopped || document.hidden) return;
      const cards = [...el.querySelectorAll('[data-track]')]; if (!cards.length) return;
      busy = true;
      try {
        const fresh = new Map((await Api.getMyOrders()).map(o => [o.id, o]));
        if (stopped) return;
        cards.forEach(card => {
          const o = fresh.get(card.dataset.track); if (!o || !CONFIG.orderSteps.includes(o.status) || o.status === card.dataset.status) return;
          card.dataset.status = o.status;
          card.querySelector('[data-track-now]')?.replaceWith(Object.assign(document.createElement('div'), { innerHTML: OrderStatusNow(o.status) }).firstElementChild);
          card.querySelector('[data-track-chip]').innerHTML = Chip(t('status.' + o.status), statusTone(o.status));
          card.querySelector('.tracker')?.replaceWith(Object.assign(document.createElement('div'), { innerHTML: OrderTracker({ status: o.status }) }).firstElementChild);
          animateTrackers(card);
          const cached = ctx?.data?.orders?.find(x => x.id === o.id); if (cached) { cached.status = o.status; if (o.payment) cached.payment = o.payment; }
          Toast.show({ type: 'info', key: 'track-' + o.id, title: o.id, message: t('status.' + o.status) });
        });
      } catch (e) { console.warn('Order status refresh failed:', e?.message || e); }
      finally { busy = false; }
    };
    const timer = setInterval(tick, ms), onVis = () => { if (!document.hidden) tick(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { stopped = true; clearInterval(timer); document.removeEventListener('visibilitychange', onVis); };
  },

  },
  view(ctx) {
    const { settings: s, orders, payment } = ctx.data, cart = Store.state.cart, subtotal = Cart.subtotal();
    Checkout.settings = s; Checkout.draft.paymentMethod = 'cod';
    const active = orders.filter(o => o.status !== 'delivered');

    /* States 1 and 3: nothing to track and nothing in the cart -> explain how delivery works. */
    if (!active.length && !cart.length) {
      return `<div class="container"><div class="page-head reveal" data-reveal="up"><h1>${esc(t('delivery.title'))}</h1><p>${esc(t('dv.intro'))}</p><div class="dv-intro-cta">${Button({ label: t('dv.browse'), icon: 'utensils', href: '#/menu' })}</div></div>${this.infoView(s, orders)}</div>`;
    }

    /* State 2 (and checkout): existing tracking + existing cart/checkout, unchanged. */
    const fee = Checkout.fee(), total = subtotal + fee;
    const pct = Math.min(100, Math.round(subtotal / s.freeDeliveryThreshold * 100)), below = subtotal < s.minOrder;
    const tracking = active.length ? `<section aria-labelledby="h-track" style="margin-bottom:32px"><h2 id="h-track" style="margin-bottom:14px">${esc(t('delivery.track'))}</h2><div class="stack" style="--gap:14px">${active.map(o => this.trackCard(o, s)).join('')}</div></section>` : '';

      ? `<div class="card dv-more-row reveal" data-reveal="up"><div><h2 style="font-size:1.15rem">${esc(t('dv.moreFood'))}</h2><p>${esc(t('dv.moreFoodText'))}</p></div>${Button({ label: t('common.viewMenu'), icon: 'utensils', variant: 'outline', href: '#/menu' })}</div>`
      : `<div class="split"><section aria-labelledby="h-order"><div class="row spread" style="margin-bottom:14px"><h2 id="h-order">${esc(t('delivery.yourOrder'))}</h2>${Button({ label: t('delivery.clear'), variant: 'ghost', size: 'sm', icon: 'trash', action: 'cart:clear' })}</div><div class="cart-list">${cart.map(i => CartItem(i)).join('')}</div>${CheckoutSections(s, payment)}</section>
        <aside class="card card-pad sticky" aria-labelledby="h-sum"><h2 id="h-sum" style="font-size:1.2rem;margin-bottom:10px">${esc(t('delivery.summary'))}</h2>
          <div class="sum-row"><span>${esc(t('delivery.subtotal'))}</span><span>${formatPrice(subtotal)}</span></div>
          <div class="sum-row"><span>${esc(t('delivery.fee'))} <small data-co-optname>${esc(Checkout.optLabel())}</small></span><span data-co-fee>${esc(Checkout.feeLabel())}</span></div>
          <div class="sum-row total"><span>${esc(t('delivery.total'))}</span><span data-co-total>${formatPrice(total)}</span></div>
          ${DELIVERY_COMING_SOON ? '' : `<div style="margin:16px 0 4px"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="--w:${pct}%"></i></div>
            <p class="muted" style="font-size:.85rem;margin-top:8px">${esc(pct >= 100 ? t('delivery.freeUnlocked') : t('delivery.moreForFree', { amount: formatPrice(s.freeDeliveryThreshold - subtotal) }))}</p></div>`}
          ${below ? `<div style="margin-top:12px">${Notice({ type: 'warning', text: t('delivery.minOrder', { amount: formatPrice(s.minOrder) }) })}</div>` : ''}
          <div style="margin-top:18px">${Button({ label: t('delivery.placeOrder'), size: 'lg', block: true, action: 'order:place', disabled: below })}</div>
          <p class="muted" style="font-size:.8rem;margin-top:12px">${esc(t('delivery.next'))}</p></aside></div>`;
    return `<div class="container"><div class="page-head reveal" data-reveal="up"><h1>${esc(t('delivery.title'))}</h1><p>${esc(t('delivery.text'))}</p></div><div style="margin-top:22px">${tracking}${body}</div></div>`;

/* ---------- Location ---------- */
const DAY_ORDER = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const FEATURE_ICONS = { delivery: 'scooter', dineIn: 'utensils', takeaway: 'bag', parking: 'car', wifi: 'wifi', family: 'users' };
const toMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };
/* "Now" in the restaurant's own timezone, so the open/closed badge is right for visitors anywhere. */
function zonedNow(tz) {
  try {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).map(x => [x.type, x.value]));
    return { day: p.weekday.toLowerCase().slice(0, 3), min: (+p.hour % 24) * 60 + +p.minute };
  } catch { const d = new Date(); return { day: ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'][d.getDay()], min: d.getHours() * 60 + d.getMinutes() }; }
}
function branchStatus(b) {
  const now = zonedNow(Store.state.restaurant?.timezone || 'Africa/Addis_Ababa'), today = (b.weeklyHours || []).find(d => d.day === now.day);
  if (!today || today.closed) return { open: false, day: now.day, text: t('location.closedToday') };
  const open = now.min >= toMin(today.open) && now.min < toMin(today.close);
  return { open, day: now.day, text: open ? t('common.openUntil', { time: today.close }) : now.min < toMin(today.open) ? t('common.opensAt', { time: today.open }) : t('common.closedNow') };
}
const mapsDir = c => `https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}`;
const mapsOpen = c => `https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`;
const osmEmbed = c => { const f = n => n.toFixed(5), dx = .006, dy = .0038; return `https://www.openstreetmap.org/export/embed.html?bbox=${f(c.lng - dx)}%2C${f(c.lat - dy)}%2C${f(c.lng + dx)}%2C${f(c.lat + dy)}&layer=mapnik&marker=${f(c.lat)}%2C${f(c.lng)}`; };
function BranchPanel(b) {
  const st = branchStatus(b), name = loc(b.name), c = b.coordinates;
  const hours = DAY_ORDER.map(k => (b.weeklyHours || []).find(d => d.day === k)).filter(Boolean), steps = b.directions || [];
  return `<div class="split lc-split">
    <aside class="card card-pad sticky reveal" data-reveal="right">
      <div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">${b.isMain ? Chip(t('location.mainBranch'), 'orange') : ''}${Chip(st.open ? t('location.openNow') : t('common.closedNow'), st.open ? 'green' : 'yellow')}</div>
      <h2 style="font-size:1.35rem">${esc(name)}</h2><p class="muted" style="margin-top:4px">${esc(st.text)}</p>

/* Realtime: a new customer order (INSERT on public.orders) refreshes Admin -> Orders without a manual reload.
   One channel at a time, and only while the admin is on #/admin/orders. The Router runs a page's cleanup before every render,
   so the channel survives re-renders / filter changes / status updates on that page and is removed when the admin leaves or signs out.
   Each subscription uses a unique channel name: removeChannel() is async, and supabase-js hands back the *existing* channel for a
   repeated name, which would throw on .on() after subscribe() if the admin left and came back quickly. */
const ARL = '[Admin Orders Realtime]';
let adminOrdersChannel = null, adminOrdersSeq = 0, adminOrdersTimer = null;
const onAdminOrders = () => Router.parse().path === '/admin/orders' && Auth.isAdmin();
function stopAdminOrdersRealtime() {
  clearTimeout(adminOrdersTimer); adminOrdersTimer = null;
  if (!adminOrdersChannel) return;
  const ch = adminOrdersChannel; adminOrdersChannel = null;   // cleared first: late callbacks of this channel are ignored
  console.log(`${ARL} unsubscribing (admin left Orders or signed out)`);
  Promise.resolve(supabaseClient.removeChannel(ch))
    .then(r => console.log(`${ARL} channel removed:`, r))
    .catch(e => console.warn(`${ARL} could not remove the channel:`, e));
}
function refreshAdminOrdersSoon() {   // coalesces a burst of inserts into one re-render
  clearTimeout(adminOrdersTimer);
  adminOrdersTimer = setTimeout(() => {
    adminOrdersTimer = null;
    if (onAdminOrders()) Router.render({ refresh: true });   // re-runs AdminViews.orders -> Api.getOrders() (real Supabase list)
  }, 250);
}
function startAdminOrdersRealtime() {
  if (adminOrdersChannel) { console.log(`${ARL} already subscribed, not creating another channel`); return; }   // never a second channel
  const name = `admin-orders-insert-${++adminOrdersSeq}`, ch = supabaseClient.channel(name);
  let connectedBefore = false;
  adminOrdersChannel = ch;
  console.log(`${ARL} subscribing to INSERT on public.orders (channel "${name}")`);
  ch.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
      if (ch !== adminOrdersChannel) return;
      console.log(`${ARL} NEW ORDER RECEIVED:`, payload?.new?.order_number || payload?.new?.id || '(unknown id)', payload);
      if (!onAdminOrders()) { stopAdminOrdersRealtime(); return; }   // admin already left the page: self-clean
      refreshAdminOrdersSoon();
    })
    .subscribe((status, err) => {
      console.log(`${ARL} subscription status: ${status}${ch !== adminOrdersChannel ? ' (old channel)' : ''}`);
      if (ch !== adminOrdersChannel) return;
      if (status === 'SUBSCRIBED') {
        console.log(`${ARL} CONNECTED: listening for new orders`);
        if (connectedBefore && onAdminOrders()) refreshAdminOrdersSoon();   // re-connected after a drop: pick up orders missed meanwhile
        connectedBefore = true;
      } else if (status === 'CHANNEL_ERROR') console.error(`${ARL} SUBSCRIPTION ERROR (CHANNEL_ERROR):`, err || '(no details)');
      else if (status === 'TIMED_OUT') console.error(`${ARL} SUBSCRIPTION ERROR (TIMED_OUT): the connection timed out`, err || '');
    });
}
window.addEventListener('hashchange', () => { if (adminOrdersChannel && !onAdminOrders()) stopAdminOrdersRealtime(); });   // safety net, e.g. if a page render failed before its cleanup was registered
Pages.admin = {
  title: () => t('admin.dashboard'), layout: 'admin', guard: () => Auth.isAdmin(),
  denied() { return `<div class="container section" style="max-width:640px">${EmptyState({ icon: 'lock', title: t('admin.restrictedTitle'), text: t('admin.restrictedText') })}<div style="text-align:center;margin-top:12px">${Button({ label: t('nav.login'), variant: 'primary', icon: 'login', action: 'auth:open', data: { mode: 'login' } })}</div></div>`; },
