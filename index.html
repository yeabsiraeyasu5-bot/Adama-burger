/* =========================================================
   src/router/router.js — hash-based routes
   `#/admin` is guarded and never appears in public navigation.
   ========================================================= */
const ROUTES = [
  { path: '/', page: Pages.home }, { path: '/menu', page: Pages.menu }, { path: '/delivery', page: Pages.delivery }, { path: '/me', page: Pages.me },
  { path: '/about', page: Pages.about }, { path: '/contact', page: Pages.contact }, { path: '/location', page: Pages.location },
  { path: '/admin', page: Pages.admin, prefix: true }, { path: '/styleguide', page: Pages.styleguide },
];
const NOT_FOUND = { title: () => '404', render: () => `<div class="container section" style="max-width:640px">${EmptyState({ icon: 'compass', title: '404', text: t('soon.text'), action: { label: t('common.backHome'), href: '#/', variant: 'dark' } })}</div>` };

const Router = {
  current: null, active: null, cleanup: null, token: 0,
  parse() {
    const raw = location.hash.replace(/^#/, '') || '/'; const [p, qs] = raw.split('?');
    return { path: ('/' + p.replace(/^\/+|\/+$/g, '')).replace(/^\/$/, '/') || '/', query: new URLSearchParams(qs || '') };
  },
  match(path) { return ROUTES.find(r => r.path === path) || ROUTES.find(r => r.prefix && (path === r.path || path.startsWith(r.path + '/'))); },
  async render({ refresh = false, initial = false } = {}) {
    const token = ++this.token, { path, query } = this.parse(), route = this.match(path), page = route?.page || NOT_FOUND;
    const main = document.getElementById('main'), allowed = !page.guard || page.guard();
    const ctx = { path, query, data: {}, section: path.split('/')[2] || 'dashboard' };
    document.body.dataset.layout = page.layout === 'admin' && allowed ? 'admin' : 'public';
    this.cleanup?.(); this.cleanup = null; this.current = { path, query, route }; this.active = { route, page, ctx };
    Chrome.update();
    const fid = refresh ? document.activeElement?.id : null, y = window.scrollY;
    const timer = refresh ? null : setTimeout(() => { if (token === this.token) main.innerHTML = Loading({ variant: page.skeleton || 'spinner' }); }, 140);
    if (!refresh && !initial) window.scrollTo({ top: 0 });
    try {
      const html = await (allowed ? page.render(ctx) : page.denied(ctx));
      clearTimeout(timer); if (token !== this.token) return;
      main.innerHTML = refresh ? html : `<div class="page-enter">${html}</div>`;
      this.cleanup = allowed ? (page.mount?.(main, ctx) || null) : null;
      Reveal.observe(main, refresh); animateTrackers(main);
      if (refresh) { window.scrollTo({ top: y }); if (fid) document.getElementById(fid)?.focus({ preventScroll: true }); }
      else if (!initial) main.focus({ preventScroll: true });
      document.title = `${page.title()} | ${Store.state.restaurant?.name || CONFIG.brandFallback}`;
    } catch (err) {
      clearTimeout(timer); if (token !== this.token) return; console.error(err);
      main.innerHTML = ErrorState();
    }
  },
  repaint() {   // synchronous re-render from cached page data (used when the cart changes)
    const a = this.active; if (!a?.page.view) return;
    const main = document.getElementById('main'), fid = document.activeElement?.id;
    this.cleanup?.(); main.innerHTML = a.page.view(a.ctx); this.cleanup = a.page.mount?.(main, a.ctx) || null;
    Reveal.observe(main, true); animateTrackers(main); if (fid) document.getElementById(fid)?.focus({ preventScroll: true });
  },
};
function animateTrackers(root) {
  requestAnimationFrame(() => requestAnimationFrame(() => root.querySelectorAll('.tracker[data-p]').forEach(el => el.style.setProperty('--p', el.dataset.p))));
}

  'sg:toast': el => Toast.show({ type: el.dataset.type, title: el.dataset.type[0].toUpperCase() + el.dataset.type.slice(1), message: 'This is how a notification looks.' }),
  'sg:confirm': () => Modal.confirm({ title: 'Delete this item?', text: 'This cannot be undone.', confirmLabel: 'Delete', danger: true }),
  'sg:tracker': el => { const h = document.getElementById('sg-tracker'); h.innerHTML = OrderTracker({ status: el.dataset.status }); animateTrackers(h); },
};
const num = v => (v === '' || v == null ? NaN : Number(v));
const Forms = {
  async adminProduct(form) {
    const v = Object.fromEntries(new FormData(form)), errs = {}, id = form.dataset.id;
    if (!v.name_en?.trim()) errs.name_en = 'Enter a name.';
    if (!(num(v.price) > 0)) errs.price = 'Enter a price above 0.';
    if (Object.keys(errs).length) return showFieldErrors(form, errs);
    const list = await Api.getProducts(), used = new Set(list.map(p => p.id)); let pid = id || `p-${slug(v.name_en) || 'item'}`; while (!id && used.has(pid)) pid += '-2';
    const prep = num(v.prepMinutes), p = { id: pid, categoryId: v.categoryId, price: num(v.price), imageUrl: v.imageUrl.trim() || null,
      name: cleanLoc({ en: v.name_en, am: v.name_am, om: v.name_om }), description: v.description.trim() ? { en: v.description.trim() } : null, tag: v.tag.trim() ? { en: v.tag.trim() } : null,
      featured: !!v.featured, isAvailable: !!v.isAvailable, prepMinutes: prep > 0 ? prep : null };
    if (p.description === null || p.tag === null) { const old = id ? await Api.getProduct(id) : {}; if (p.description === null && old.description && typeof old.description === 'object' && Object.keys(old.description).some(k => k !== 'en')) p.description = { ...old.description, en: '' }; }
    const btn = form.querySelector('[type=submit]'); setLoading(btn, true);
    try { await Api.admin.saveProduct(p); adminDone(id ? 'Product saved' : 'Product added'); } catch (e) { setLoading(btn, false); adminFail(e); }
  },
  async adminCategory(form) {
    const v = Object.fromEntries(new FormData(form)), id = form.dataset.id;
    if (!v.name_en?.trim()) return showFieldErrors(form, { name_en: 'Enter a name.' });
    const used = new Set((await Api.getCategories()).map(c => c.id)); let cid = id || slug(v.name_en) || 'category'; while (!id && used.has(cid)) cid += '-2';
    try { await Api.admin.saveCategory({ id: cid, icon: v.icon, name: cleanLoc({ en: v.name_en, am: v.name_am, om: v.name_om }) }); Store.set({ categories: await Api.getCategories() }); adminDone('Category saved'); } catch (e) { adminFail(e); }
  },
  async adminDelivery(form) {
    const v = Object.fromEntries(new FormData(form)), errs = {};
    ['fee', 'freeDeliveryThreshold', 'minOrder', 'etaMin', 'etaMax', 'fastSurcharge', 'fastEtaMin', 'fastEtaMax'].forEach(k => { if (!(num(v[k]) >= 0)) errs[k] = 'Enter a number.'; });
    if (!errs.etaMax && num(v.etaMax) < num(v.etaMin)) errs.etaMax = 'Must be at least the first time.';
    if (!errs.fastEtaMax && num(v.fastEtaMax) < num(v.fastEtaMin)) errs.fastEtaMax = 'Must be at least the first time.';
    if (Object.keys(errs).length) return showFieldErrors(form, errs);
    await adminRun(() => Api.admin.saveDelivery({ enabled: !!v.enabled, fee: num(v.fee), freeDeliveryThreshold: num(v.freeDeliveryThreshold), minOrder: num(v.minOrder), estimatedMinutes: { min: num(v.etaMin), max: num(v.etaMax) }, fastSurcharge: num(v.fastSurcharge), fastEstimatedMinutes: { min: num(v.fastEtaMin), max: num(v.fastEtaMax) }, areas: v.areas.split('\n').map(x => x.trim()).filter(Boolean) }), 'Delivery settings saved');
  },
  async adminPayment(form) {
    const v = Object.fromEntries(new FormData(form)), on = !!v.enabled;
    if (on && !/^[+\d][\d\s-]{8,}$/.test(v.accountNumber.trim())) return showFieldErrors(form, { accountNumber: 'Enter the Telebirr account number.' });
    await adminRun(() => Api.admin.savePayment({ enabled: on, accountNumber: v.accountNumber.trim(), accountName: v.accountName.trim() }), 'Payment settings saved');
  },
  async adminRestaurant(form) {
    const v = Object.fromEntries(new FormData(form)); if (!v.name.trim()) return showFieldErrors(form, { name: 'Enter a name.' });
    const r = Store.state.restaurant;
    await adminRun(async () => { const saved = await Api.admin.saveRestaurant({ name: v.name.trim(), phone: v.phone.trim(), email: v.email.trim(), address: { ...r.address, en: v.address.trim() }, ctaImageUrl: v.ctaImageUrl.trim() || null,
      hours: { open: v.open, close: v.close, label: { ...r.hours.label, en: `Every day, ${v.open} to ${v.close}` } } }); Store.set({ restaurant: saved }); Chrome.update(); }, 'Restaurant saved');
  },
  async review(form) {
    const v = Object.fromEntries(new FormData(form)), btn = form.querySelector('[type=submit]'); setLoading(btn, true);
    try {
      await Api.submitReview({ rating: +v.rating || 0, author: v.author, text: v.text });
      Modal.close(); Toast.show({ type: 'success', title: t('review.thanks'), message: t('review.thanksText') });
      refreshReviewsUI().catch(err => console.error('Review refresh failed:', err));
    } catch (e) {
      setLoading(btn, false);
      if (e.fields) { const m = {}; for (const k in e.fields) m[k] = t(e.fields[k]); showFieldErrors(form, m); } else Toast.show({ type: 'error', title: t('error.title'), message: e.message });
    }
  },
  async profile(form) {
    const v = Object.fromEntries(new FormData(form)), btn = form.querySelector('[type=submit]'); showFieldErrors(form, {}, { focus: false }); setLoading(btn, true);
    try {
      const me = await Api.updateProfile({ name: v.name, phone: v.phone, bio: v.bio });
      Store.set({ session: me }); Chrome.update(); Modal.close();   // new data is in the store before the page repaints: no refresh needed
      if (me.localOnly) Toast.show({ type: 'info', title: t('profile.savedLocal'), message: t('profile.savedLocalText') });
      else Toast.show({ type: 'success', title: t('profile.saved') });
      if (Router.current?.path === '/me') Router.render({ refresh: true });
    } catch (e) {
      setLoading(btn, false);
      if (e.fields) { const m = {}; for (const k in e.fields) m[k] = t(e.fields[k]); showFieldErrors(form, m); } else Toast.show({ type: 'error', title: t('error.title'), message: e.message });
    }
  },
  async contact(form) {
    const v = Object.fromEntries(new FormData(form)), errs = {}, email = (v.email || '').trim(), phone = (v.phone || '').trim();
    if (v.website) return;   // honeypot: real visitors never see or fill this field
    if (!v.name?.trim()) errs.name = t('contact.errName');
    if (email && !/^\S+@\S+\.\S+$/.test(email)) errs.email = t('auth.errEmail'); else if (!email && !phone) errs.email = t('contact.errContact');
    if (phone && !/^[+\d][\d\s()-]{6,}$/.test(phone)) errs.phone = t('contact.errPhone');
    if ((v.message || '').trim().length < 10) errs.message = t('contact.errMessage');
    if (Object.keys(errs).length) return showFieldErrors(form, errs);
    showFieldErrors(form, {});
    const btn = form.querySelector('[type=submit]'); setLoading(btn, true);
    try {
      await Api.submitContactMessage({ name: v.name.trim(), email, phone, topic: v.topic, message: v.message.trim() });
      const card = document.getElementById('ct-form-card');
      if (card) card.innerHTML = `<div class="state" role="status"><div class="s-art" aria-hidden="true">${Icon('check', 36)}</div><h2 style="font-size:1.25rem">${esc(t('contact.thanks'))}</h2><p>${esc(t('contact.thanksText', { name: v.name.trim() }))}</p>${Button({ label: t('contact.another'), variant: 'dark', action: 'contact:again' })}</div>`;
      Toast.show({ type: 'success', title: t('contact.thanks') });
    } catch (e) {
      setLoading(btn, false);
      if (e.fields && Object.keys(e.fields).length) { const m = {}; for (const k in e.fields) m[k] = t(e.fields[k]); showFieldErrors(form, m); } else Toast.show({ type: 'error', title: t('error.title'), message: e.message });
    }
  },
  none() {},
};

document.addEventListener('click', e => { const el = e.target.closest('[data-action]'); if (el && Actions[el.dataset.action]) Actions[el.dataset.action](el, e); });
document.addEventListener('change', e => { const sel = e.target.closest?.('[data-admin-status]'); if (sel) adminRun(() => Api.admin.setOrderStatus(sel.dataset.adminStatus, sel.value), 'Order updated'); });
document.addEventListener('input', e => { if (e.target.name === 'imageUrl' && e.target.closest('[data-form="adminProduct"]')) e.target.closest('form').querySelector('[data-prev]').innerHTML = Photo({ src: e.target.value.trim() || null, icon: 'utensils' }); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); Forms[f.dataset.form]?.(f); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (Modal.current) Modal.close(); else if (Drawer.isOpen) Drawer.close(); return; }
  if (e.key === 'Tab') { const c = Modal.current?.el || Drawer.el; if (c) trapTab(e, c); return; }
  const item = e.target.closest?.('[role="tab"],[role="radio"]');
  if (item && ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
    const list = [...item.parentElement.querySelectorAll(`[role="${item.getAttribute('role')}"]`)]; let i = list.indexOf(item);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? list.length - 1 : (i + (['ArrowRight', 'ArrowDown'].includes(e.key) ? 1 : -1) + list.length) % list.length;
    e.preventDefault(); list[i].focus(); list[i].click();
  }
});

// Photos fade in once loaded. If one fails, it is removed and the icon placeholder underneath stays.
document.addEventListener('load', e => { if (e.target.matches?.('.photo img')) e.target.classList.add('is-loaded'); }, true);
document.addEventListener('error', e => { if (e.target.matches?.('.photo img')) e.target.remove(); }, true);

/* Checkout: keep the draft in sync with the form, update totals in place, open the Telebirr popup. */
document.addEventListener('input', e => { const f = e.target; if (f.closest?.('#co-form') && f.type !== 'radio' && f.name in Checkout.draft) Checkout.draft[f.name] = f.value; });
document.addEventListener('change', async e => {
  const f = e.target;
  if (f.matches?.('#co-form input[type="radio"]')) {
    Checkout.draft[f.name] = f.value; Checkout.refresh();
    if (f.name === 'paymentMethod' && f.value === 'telebirr') openTelebirrModal();
  }
  if (f.matches?.('[data-co-file]')) {
    const file = f.files?.[0]; if (!file) return;
    const err = document.getElementById('pay-file-err'), prev = document.getElementById('pay-preview'), save = document.getElementById('pay-save');
    err.hidden = true;
    try {
      Checkout.pending = await imageToProof(file); const img = document.createElement('img'); img.className = 'co-proof-img'; img.alt = ''; img.src = Checkout.pending.dataUrl; prev.replaceChildren(img); save.disabled = false;
    } catch (x) { Checkout.pending = null; prev.replaceChildren(); save.disabled = true; err.textContent = t(x.message.startsWith('pay.') ? x.message : 'pay.errRead'); err.hidden = false; }
  }
});

Store.subscribe(patch => { if ('cart' in patch) { Chrome.updateBadges(); if (Router.active?.page.reactiveCart) Router.repaint(); } });

/* =========================================================
   src/app/main.js — boot
   ========================================================= */
async function boot() {
  document.documentElement.classList.add('js-reveal');
  const saved = safeStorage.get(CONFIG.storageKeys.lang); if (saved && STRINGS[saved]) I18n.set(saved);
  Cart.load(); Chrome.init();
  const main = document.getElementById('main'); main.innerHTML = Loading();
  try {
    const [restaurant, categories, session] = await Promise.all([Api.getRestaurantInfo(), Api.getCategories(), Api.auth.getSession()]);
    Store.set({ restaurant, categories, session });
  } catch (e) { console.error(e); main.innerHTML = ErrorState(); return; }
  Chrome.update();
  if (/^#(error=|error_code=|error_description=|access_token=)/.test(location.hash)) {   // OAuth return params must never reach the hash router
    const failed = /^#error/.test(location.hash);
    history.replaceState(null, '', location.pathname + location.search + '#/');
    if (failed) Toast.show({ type: 'error', title: t('error.title'), message: t('auth.googleFailed') });
  } else if (/[?&]error=/.test(location.search) && /[?&]error_description=/.test(location.search)) {   // PKCE-style error return
    history.replaceState(null, '', location.pathname + '#/');
    Toast.show({ type: 'error', title: t('error.title'), message: t('auth.googleFailed') });
  }
  if (!boot.done) {
    window.addEventListener('hashchange', () => Router.render());
    try { Api.auth.onAuthStateChange((event, sb) => setTimeout(async () => {   // deferred: never call Supabase from inside the auth callback
      const cur = Store.state.session, repaint = () => { Chrome.update(); if (Router.current.path === '/me' || Router.current.path.startsWith('/admin')) Router.render({ refresh: true }); };
      if (event === 'SIGNED_OUT') { if (cur) { Store.set({ session: null }); repaint(); } }
      else if ((event === 'SIGNED_IN' || event === 'USER_UPDATED') && sb?.user && cur?.id !== sb.user.id) { Store.set({ session: await Api.auth.getSession() }); repaint(); }
    }, 0)); } catch (e) { console.warn('Supabase auth listener unavailable:', e); }   // a failed listener must never block the app
    boot.done = true;
  }
  Router.render({ initial: true });
}
boot();

// Handy for developers: window.Adama.Api, .Store, .Cart, .CONFIG, .I18n
window.Adama = { CONFIG, Api, Store, Cart, I18n, Router, MOCK };

})();
